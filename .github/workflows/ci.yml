name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check src/main.js
      - run: node --check src/preload.js
      - run: node --check src/account-store.js
      - run: node --check src/renderer/renderer.js
      - run: npm run dist
